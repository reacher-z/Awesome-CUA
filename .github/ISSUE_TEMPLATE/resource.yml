name: Resource or correction
description: Suggest a source-backed resource, report a missing asset, or correct a record.
title: "[resource] "
labels: ["area:data"]
body:
  - type: dropdown
    id: intent
    attributes:
      label: Request type
      options:
        - New resource
        - Missing asset
        - Correction
    validations:
      required: true
  - type: input
    id: resource
    attributes:
      label: Resource name or catalog ID
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source URL
      description: Official paper, repository, dataset/model card, or publisher documentation.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested addition or correction
      description: Explain scope, evidence, and any uncertain fields. Distinguish code, data, and weights licenses.
    validations:
      required: true
  - type: checkboxes
    id: searched
    attributes:
      label: Existing records
      options:
        - label: I searched [catalog.jsonl](https://awesomecua.com/downloads/catalog.jsonl) and [candidates.jsonl](https://github.com/reacher-z/Awesome-CUA/blob/main/data/candidates.jsonl) for this resource, its aliases, and mirrors.
          required: true
