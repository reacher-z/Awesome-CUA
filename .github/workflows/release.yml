name: Data release

on:
  push:
    tags: ['v*']
  # Dispatch on a v* tag to retry its release; dispatch on a branch builds the same assets as an artifact without publishing.
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate the source catalog
        run: |
          python scripts/catalog.py validate
          python scripts/catalog.py build --check
      - name: Build the exports
        run: |
          python scripts/catalog.py build
          python scripts/build_site.py
      - name: Collect release assets, checksums and notes
        run: |
          mkdir -p release/assets
          cp data/catalog.jsonl data/coverage.json dist/catalog.json dist/catalog.sqlite release/assets/
          cp dist/site/downloads/topics.json dist/site/downloads/benchmarks-profiles.json dist/site/downloads/datasets-profiles.json release/assets/
          python scripts/package_data_release.py --site dist/site --output release/assets --source-commit "$(git rev-parse HEAD)" --source-ref "$GITHUB_REF"
          (cd release/assets && sha256sum -- awesomecua-data.zip benchmarks-profiles.json catalog.json catalog.jsonl catalog.sqlite coverage.json datasets-profiles.json release-manifest.json topics.json > SHA256SUMS)
          python - "$(git rev-parse HEAD)" > release/notes.md <<'EOF'
          import json, os, sys
          commit, repo = sys.argv[1], os.environ['GITHUB_REPOSITORY']
          read = lambda name: json.load(open('release/assets/' + name, encoding='utf-8'))
          coverage, topics = read('coverage.json'), read('topics.json')
          rows = [('Active records', coverage['total_records']), ('Curated', coverage['curated_records']), ('Metadata only', coverage['metadata_only_records'])]
          rows += [(f'Kind: {kind}', count) for kind, count in sorted(coverage['by_kind'].items())]
          rows += [('Benchmark profiles', read('benchmarks-profiles.json')['profile_count']), ('Dataset profiles', read('datasets-profiles.json')['profile_count']), ('Topics', len(topics['topics']))]
          print(f'Catalog exports built from source commit [`{commit}`](https://github.com/{repo}/tree/{commit}), with coverage as of {coverage["as_of_utc"]}.\n')
          print('| Records | Count |\n| --- | ---: |\n' + '\n'.join(f'| {label} | {count:,} |' for label, count in rows) + '\n')
          print('The complete pinned data snapshot is in `awesomecua-data.zip`; `release-manifest.json` records its source commit, members and fingerprints. The ZIP includes full RAG, citations and topic subsets, with data-only agent instructions.\n')
          print('Counts are resources, not independent projects; topic memberships overlap. Check the downloads with `sha256sum -c SHA256SUMS`, and cite this release by its tag.')
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Report a preview build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "::notice::Built release assets from $GITHUB_REF without publishing; dispatch on a v* tag to release"
  release:
    # Only this job, with no checkout, can write; it publishes the files the build job made.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # --verify-tag fails instead of creating a missing tag; no workflow creates or moves release tags.
        run: gh release create "$GITHUB_REF_NAME" release/assets/* --verify-tag --title "Awesome CUA catalog $GITHUB_REF_NAME" --notes-file release/notes.md -R "$GITHUB_REPOSITORY"
