name: Links
# Weekly check of every link in README.md, README.zh-CN.md and docs/. Hosts that refuse automated clients are
# skipped with their reasons in .github/lychee.toml; any other link that does not answer 2xx or 429 after retries
# fails the run, and the job summary lists it with the file that carries it.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  links:
    runs-on: ubuntu-latest
    # Hugging Face rate limits stretch a full run to 40 to 60 minutes.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config .github/lychee.toml README.md README.zh-CN.md 'docs/**/*.md'
          output: lychee/report.md
      - name: Keep the link report
        if: ${{ !cancelled() && hashFiles('lychee/report.md') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: lychee/report.md
          if-no-files-found: error
          retention-days: 14
