name: Publish catalog website

on:
  push:
    branches: [main]
  schedule:
    # GitHub has started this repository's scheduled runs hours late, so frequent checks bound the wait after a scan.
    # A check without a new source commit only reads two revisions; it builds, commits and deploys nothing.
    - cron: '25,55 * * * *'
      timezone: UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-publication
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      source_commit: ${{ steps.decision.outputs.source_commit }}
    steps:
      - name: Check out the published revision record
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          sparse-checkout: data/build-info.json
          sparse-checkout-cone-mode: false
          filter: blob:none
          persist-credentials: false
      - name: Compare the source catalog head with the published revision
        id: decision
        run: |
          source=$(git ls-remote https://github.com/reacher-z/Awesome-CUA.git refs/heads/main | cut -f1)
          if ! printf '%s\n' "$source" | grep -Eqx '[0-9a-f]{40}'; then echo '::error::Could not read the source catalog main revision'; exit 1; fi
          committed=$(jq -r '.source_commit // empty' data/build-info.json 2>/dev/null) || committed=
          # The snapshot is committed before deployment, so the live record decides and a failed deployment is retried.
          # This repository's github.io name keeps answering after a custom domain is set: Pages redirects it with its path.
          live=$(curl -fsSL --max-time 20 "https://${GITHUB_REPOSITORY#*/}/data/build-info.json" | jq -r '.source_commit // empty') || live=
          # The Pages CDN caches that record for up to 10 minutes whatever the query string, so a fresh snapshot gets 20.
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          publish=true
          # Only a scheduled check is skipped: a push or a manual dispatch always rebuilds.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if [ "$live" = "$source" ]; then
              publish=false
              echo "::notice title=Nothing new to publish::Source commit $source is already live; build, snapshot commit and deployment are skipped."
            elif [ "$committed" = "$source" ] && [ -z "$live" ] && [ "$age" -lt 7200 ]; then
              # An unreadable live site (for example during a DNS change) retries at most once per scan interval.
              publish=false
              echo "::warning title=Live site unreadable::Source commit $source is already in the website snapshot, but the live record could not be read; deployment is retried once the snapshot is two hours old."
            elif [ "$committed" = "$source" ] && [ -n "$live" ] && [ "$age" -lt 1200 ]; then
              publish=false
              echo "::notice title=Deployment propagating::Source commit $source was committed $((age / 60)) minutes ago; the live site can still serve its cached previous record."
            fi
          fi
          printf 'publish=%s\nsource_commit=%s\n' "$publish" "$source" >> "$GITHUB_OUTPUT"
          printf '%s check: source `%s`, live `%s`, committed `%s` (%s s ago), publish: %s\n' "$GITHUB_EVENT_NAME" "$source" "${live:-unreadable}" "${committed:-none}" "$age" "$publish" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.source_revision.outputs.source_commit }}
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out website snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Check out public source catalog
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: reacher-z/Awesome-CUA
          # The revision the gate compared, even if main moves before this checkout; the next check publishes newer commits.
          ref: ${{ needs.gate.outputs.source_commit }}
          path: .pipeline/source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .pipeline/source/requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r .pipeline/source/requirements-dev.txt
      - name: Validate source data and website behavior
        working-directory: .pipeline/source
        run: |
          python scripts/catalog.py validate
          python scripts/catalog.py build --check
          python -m unittest discover -s tests -v
          node --test tests/web.test.mjs
      - name: Build website from the verified catalog
        working-directory: .pipeline/source
        run: |
          python scripts/build_site.py
          python scripts/prepare_publication.py --site-dir "$GITHUB_WORKSPACE" --skip-profile
      - name: Record source revision
        id: source_revision
        run: |
          CUA_SOURCE_SHA=$(git -C .pipeline/source rev-parse HEAD)
          printf 'source_commit=%s\n' "$CUA_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          CUA_SOURCE_SHA="$CUA_SOURCE_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          info={'source_repository':'https://github.com/reacher-z/Awesome-CUA','source_commit':os.environ['CUA_SOURCE_SHA'],'publication_run':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}
          for target in [Path('data/build-info.json'),Path('.pipeline/source/dist/site/data/build-info.json')]:
              target.write_text(json.dumps(info,indent=2)+'\n')
          PY
          # shellcheck disable=SC2016 # The backticks are Markdown code spans, not command substitution.
          printf 'Source catalog commit: `%s`\n' "$CUA_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the public website snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkouts keep no credentials: only the push and pull below get the token, as a per-command header the rest of this step never sees.
          auth=(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')")
          unset GH_TOKEN
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh website from the verified source catalog'
            # main can move after checkout; replay the snapshot onto it before retrying.
            for attempt in 1 2 3; do
              if env "${auth[@]}" git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then echo '::error::The website snapshot was not pushed to main after 3 attempts'; exit 1; fi
              env "${auth[@]}" git pull --rebase origin main || { echo '::error::The website snapshot could not be rebased onto a newer main; re-run publication'; git rebase --abort; exit 1; }
            done
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pipeline/source/dist/site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static catalog
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  notify_search:
    name: Notify search engines of published changes
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the published snapshot and accepted submission state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Check out the exact source used in this publication
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: reacher-z/Awesome-CUA
          ref: ${{ needs.build.outputs.source_commit }}
          path: .pipeline/source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Notify IndexNow after live-site and ownership checks
        run: |
          python3 .pipeline/source/scripts/submit_indexnow.py --submit \
            --site-dir "$GITHUB_WORKSPACE" \
            --state .indexnow/state.json \
            --receipts .indexnow/submissions.json
      - name: Preserve accepted state and actual submission receipts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkouts keep no credentials: only the push and pull below get the token, as a per-command header the rest of this step never sees.
          auth=(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')")
          unset GH_TOKEN
          if [ -d .indexnow ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .indexnow
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m 'Record search notification outcome for the published catalog'
              for attempt in 1 2 3; do
                if env "${auth[@]}" git push origin HEAD:main; then break; fi
                if [ "$attempt" = 3 ]; then echo '::error::The search notification receipts were not pushed to main after 3 attempts'; exit 1; fi
                env "${auth[@]}" git pull --rebase origin main || { echo '::error::The search notification receipts could not be rebased onto a newer main; re-run publication'; git rebase --abort; exit 1; }
              done
            fi
          fi
