name: README lint
# awesome-lint on the English README. It fails on any finding, so a README change that repeats a link or
# breaks the list format is caught on the pull request. It is a separate workflow from `Catalog quality`
# and is not a required check, so a scan commit that regenerates the README never blocks other work.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/build.py
      - 'tests/awesome-lint/**'
      - .github/workflows/readme-lint.yml
  pull_request:
    paths:
      - README.md
      - scripts/build.py
      - 'tests/awesome-lint/**'
      - .github/workflows/readme-lint.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install the pinned awesome-lint
        run: npm ci --prefix tests/awesome-lint --ignore-scripts --no-audit --no-fund
      - name: Lint README.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/awesome-lint/lint.mjs README.md .cache/awesome-lint/findings.json
      - name: Fail on any finding
        run: |
          python3 - <<'PY'
          import json, sys
          findings = json.load(open('.cache/awesome-lint/findings.json'))['findings']
          for item in findings:
              print(f"{item['file']}:{item['line']} {item['rule']}: {item['reason']}")
          sys.exit(1 if findings else 0)
          PY
