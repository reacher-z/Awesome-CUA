name: Catalog quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate source-backed records
        run: python scripts/catalog.py validate
      - name: Check generated views before rebuilding
        run: python scripts/catalog.py build --check
      - name: Test ingestion and review safeguards
        run: python scripts/run_tests.py
      - name: Build portable exports
        run: python scripts/catalog.py build
      - name: Test website search and state handling
        run: node --test tests/web.test.mjs
      - name: Build static website
        run: python scripts/build_site.py
      - name: Check search relevance and index size
        run: node --test tests/search_quality.test.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cua-catalog
          path: |
            dist/catalog.sqlite
            dist/catalog.json
            data/catalog.jsonl
            data/coverage.json
            dist/site/
