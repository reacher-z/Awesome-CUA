name: README lint
# A gate on README.md: every awesome-lint finding that tests/awesome-lint/allowlist.json does not record as a false
# positive fails the job. The README blocks come from scripts/build.py, so a failure means the builder or the
# authored text needs a fix. This workflow is separate from `Catalog quality` and is not a required check, so a
# scan commit that regenerates the README is never blocked by it.
on:
  push:
    branches: [main]
    paths:
      - 'README*.md'
      - scripts/build.py
      - scripts/awesome_lint_report.py
      - 'tests/awesome-lint/**'
      - .github/workflows/readme-lint.yml
  pull_request:
    paths:
      - 'README*.md'
      - scripts/build.py
      - scripts/awesome_lint_report.py
      - 'tests/awesome-lint/**'
      - .github/workflows/readme-lint.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the pinned awesome-lint
        run: npm ci --prefix tests/awesome-lint --ignore-scripts --no-audit --no-fund
      - name: Lint README.md
        run: node tests/awesome-lint/lint.mjs README.md .cache/awesome-lint/findings.json
      - name: Fail on unrecorded findings
        if: ${{ !cancelled() }}
        run: python3 scripts/awesome_lint_report.py .cache/awesome-lint/findings.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep every finding for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awesome-lint-report
          path: .cache/awesome-lint/findings.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
