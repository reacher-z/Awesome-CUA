name: Discovery scans every two hours

on:
  schedule:
    - cron: '7 */2 * * *'
      timezone: UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the scan and every check without committing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: catalog-discovery
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
      repeated_partial: ${{ steps.scan.outputs.repeated_partial }}
      status: ${{ steps.scan.outputs.status }}
      notes: ${{ steps.scan.outputs.notes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Discover and verify public metadata
        id: scan
        run: python scripts/scan.py
      - name: Check generated data and review boundaries
        id: quality
        run: |
          python scripts/catalog.py validate
          python scripts/catalog.py build --check
          python -m unittest discover -s tests -v
          node --test tests/web.test.mjs
          python scripts/build_site.py
      - name: Snapshot verified public scan data
        id: snapshot
        if: steps.quality.outcome == 'success'
        env:
          SCAN_QUALITY_OUTCOME: ${{ steps.quality.outcome }}
        run: python scripts/package_scan_snapshot.py
      - name: Report a skipped commit
        if: github.ref != 'refs/heads/main' || inputs.dry_run
        run: echo "::notice::Scan ran on $GITHUB_REF; commit skipped"
      - name: Commit verified scan output
        id: commit
        # The push targets main, so a run on any other ref would fast-forward main to that unreviewed branch.
        if: github.ref == 'refs/heads/main' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkouts keep no credentials: only the push and pull below get the token, as a per-command header the rest of this step never sees.
          auth=(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')")
          unset GH_TOKEN
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs README.md README.zh-CN.md
          git diff --cached --check
          # The checks above ran on the working tree; refuse a commit that would omit any of it.
          if ! git diff --quiet; then echo 'Tracked changes outside the committed paths:'; git diff --stat; exit 1; fi
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then printf 'Untracked files outside the committed paths:\n%s\n' "$untracked"; exit 1; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update public-source scan and verified metadata'
            # main can move during the scan: replay the commit onto it and rebuild the generated files from both sides' inputs before retrying.
            for attempt in 1 2 3; do
              if env "${auth[@]}" git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then echo '::error::The scan commit was not pushed to main after 3 attempts'; exit 1; fi
              env "${auth[@]}" git pull --rebase origin main || { echo '::error::main moved during the scan and the scan commit could not be rebased onto it; re-dispatch the scan'; git rebase --abort; exit 1; }
              python scripts/catalog.py build
              python scripts/catalog.py validate
              git add data docs README.md README.zh-CN.md
              git diff --cached --quiet || git commit -q --amend --no-edit
            done
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scan-evidence
          path: |
            data/scan-status.json
            data/recent-paper-search.json
            data/paper-discovery-status.json
            data/paper-discovery-queries.json
            data/research-discovery.json
            data/discovery-runs.json
            data/harvest-failures.jsonl
          retention-days: 30
      - name: Retain verified scan snapshot
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-scan-snapshot
          path: dist/scan-snapshot/
          retention-days: 30
  dispatch_quality:
    # Pushes made with GITHUB_TOKEN start no push workflows; dispatch is the documented exception.
    # Only this job, with no checkout, holds the actions permission; the scan job and its dependencies never do.
    needs: scan
    if: needs.scan.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run Catalog quality on the scan commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog.yml --ref main -R "$GITHUB_REPOSITORY"
  track_scan_health:
    # One tracking issue stays open while scans of main are unhealthy: it is edited in place on each such run and
    # closed by the next healthy run, so a long outage neither fails silently nor posts a new issue every two hours.
    needs: scan
    if: always() && github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Update the scan health tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_RESULT: ${{ needs.scan.result }}
          SCAN_STATUS: ${{ needs.scan.outputs.status }}
          SCAN_NOTES: ${{ needs.scan.outputs.notes }}
          REPEATED_PARTIAL: ${{ needs.scan.outputs.repeated_partial }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=scan-health
          repo=(-R "$GITHUB_REPOSITORY")
          open=$(gh issue list "${repo[@]}" --label "$label" --state open --limit 20 --json number --jq 'map(.number) | sort | map(tostring) | join(" ")')
          read -r tracking duplicates <<< "$open" || true
          if [ "$SCAN_RESULT" = success ] && [ "$REPEATED_PARTIAL" != true ]; then
            for number in $open; do
              gh issue close "$number" "${repo[@]}" --reason completed --comment "Resolved by $RUN_URL: the scan job succeeded with status \`${SCAN_STATUS:-unknown}\`."
            done
            exit 0
          fi
          # A failed job may never have written a receipt; the jobs API still names the failing step.
          failing=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name + " (" + ([.steps[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join(", ")) + ")"] | join("; ")' || true)
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          count=1; since=$now
          if [ -n "$tracking" ]; then
            marker=$(gh issue view "$tracking" "${repo[@]}" --json body --jq .body | sed -n 's/^<!-- scan-health unhealthy_runs=\([0-9][0-9]*\) since=\([0-9TZ:-]*\) -->$/\1 \2/p') || marker=
            marker=${marker%%$'\n'*}
            if [ -n "$marker" ]; then read -r count since <<< "$marker"; count=$((count + 1)); fi
          fi
          {
            printf '<!-- scan-health unhealthy_runs=%s since=%s -->\n' "$count" "$since"
            printf 'The scheduled discovery scan of `main` is unhealthy. This issue is edited in place on each unhealthy run and closed automatically by the next healthy run.\n\n'
            printf -- '- Latest unhealthy run: %s (%s, %s)\n' "$RUN_URL" "$GITHUB_EVENT_NAME" "$now"
            printf -- '- Scan job: `%s`; scan status: `%s`; repeated partial scans: `%s`\n' "$SCAN_RESULT" "${SCAN_STATUS:-not recorded}" "${REPEATED_PARTIAL:-false}"
            printf -- '- Failing jobs and steps: %s\n' "${failing:-none recorded}"
            printf -- '- Consecutive unhealthy runs: %s since %s\n\n' "$count" "$since"
            printf 'Gaps recorded by the latest scan receipt:\n\n```text\n%s\n```\n' "$(printf '%s' "${SCAN_NOTES:-none recorded}" | sed 's/```/` ` `/g')"
          } > "$RUNNER_TEMP/scan-health.md"
          if [ -z "$tracking" ]; then
            gh label create "$label" "${repo[@]}" --color B60205 --description 'Open while the scheduled discovery scan is unhealthy' 2>/dev/null || true
            gh issue create "${repo[@]}" --title 'Scheduled discovery scan is unhealthy' --label "$label" --body-file "$RUNNER_TEMP/scan-health.md"
          else
            gh issue edit "$tracking" "${repo[@]}" --body-file "$RUNNER_TEMP/scan-health.md"
            for number in $duplicates; do
              gh issue close "$number" "${repo[@]}" --reason 'not planned' --comment "Duplicate of #$tracking, which tracks scan health."
            done
          fi
  report_repeated_partial:
    # A partial scan stays green so its verified data is committed; a run of them fails this job so GitHub sends a failure notice.
    needs: scan
    if: needs.scan.outputs.repeated_partial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail after repeated partial scans
        run: |
          echo '::error title=Repeated partial scans::Consecutive scans were partial; see the scan job annotations and the warnings in data/scan-status.json.'
          exit 1
