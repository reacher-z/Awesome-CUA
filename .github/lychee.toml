# Settings for the weekly link check (.github/workflows/links.yml) over README.md, README.zh-CN.md and docs/.
max_concurrency = 24
host_concurrency = 4
timeout = 20
max_retries = 2
retry_wait_time = 3
# Hugging Face and arena hosts answer bursts with 429; a rate-limited link is reachable.
accept = ["200..=299", "429"]
include_mail = false
no_progress = true
exclude_all_private = true
user_agent = "Mozilla/5.0 (compatible; Awesome-CUA-link-check/1.0; +https://github.com/reacher-z/Awesome-CUA)"

# Hosts that answer 403 to every automated client, including for pages a browser opens. Their status says
# nothing about the link, so they are skipped. Reasons from the 2026-11-09 probe of all 9,188 unique URLs:
exclude = [
  # doi.org resolves to publisher pages (ACM, Elsevier, IEEE, Springer) that return 403 to non-browser clients.
  '^https?://(dx\.)?doi\.org/',
  # ACM Digital Library returns 403 behind a Cloudflare challenge.
  '^https?://dl\.acm\.org/',
  # ScienceDirect returns 403 to non-browser clients.
  '^https?://(www\.)?sciencedirect\.com/',
  # ResearchGate returns 403 behind a Cloudflare challenge.
  '^https?://(www\.)?researchgate\.net/',
  # Preprints.org returns 403 behind a Cloudflare challenge.
  '^https?://(www\.)?preprints\.org/',
  # Zhihu columns return 403 without a signed-in browser session.
  '^https?://zhuanlan\.zhihu\.com/',
  # OpenAI, Adept and Perplexity answer 403 to non-browser clients behind a bot challenge; the pages open in a browser.
  '^https?://(www\.)?openai\.com/',
  '^https?://(www\.)?adept\.ai/',
  '^https?://(www\.)?perplexity\.ai/',
  # DeepLearning.AI answers 200 from home networks and 403 from GitHub-hosted runners.
  '^https?://(www\.)?deeplearning\.ai/',
  # Coverage-ledger rows that record an upstream confirmed gone on 2026-11-10 (HTTP 404 from the GitHub API and the page):
  # an unapproved proposal for a repository whose owner removed it, and a retired discovery source.
  '^https://github\.com/(THUDM/AutoGLM|agiresearch/LiteCUA|Runa-Asahi/tsuki-phone-agent|DeLunnLi/Awesome-Multimodal-GUI-Agents)$',
  # A listed product whose site answers 404 at the root; its row waits for editorial review.
  '^https://www\.sentius\.ai/?$',
]
