name: Publish catalog website

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 1,9,17 * * *'
      timezone: UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.source_revision.outputs.source_commit }}
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out website snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check out public source catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reacher-z/Awesome-CUA
          ref: main
          path: .pipeline/source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .pipeline/source/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r .pipeline/source/requirements-dev.txt
      - name: Validate source data and website behavior
        working-directory: .pipeline/source
        run: |
          python scripts/catalog.py validate
          python scripts/catalog.py build --check
          python -m unittest discover -s tests -v
          node --test tests/web.test.mjs
      - name: Build website from the verified catalog
        working-directory: .pipeline/source
        run: |
          python scripts/build_site.py
          python scripts/prepare_publication.py --site-dir "$GITHUB_WORKSPACE" --skip-profile
      - name: Record source revision
        id: source_revision
        run: |
          CUA_SOURCE_SHA=$(git -C .pipeline/source rev-parse HEAD)
          printf 'source_commit=%s\n' "$CUA_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          CUA_SOURCE_SHA="$CUA_SOURCE_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          info={'source_repository':'https://github.com/reacher-z/Awesome-CUA','source_commit':os.environ['CUA_SOURCE_SHA'],'publication_run':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}
          for target in [Path('data/build-info.json'),Path('.pipeline/source/dist/site/data/build-info.json')]:
              target.write_text(json.dumps(info,indent=2)+'\n')
          PY
          # shellcheck disable=SC2016 # The backticks are Markdown code spans, not command substitution.
          printf 'Source catalog commit: `%s`\n' "$CUA_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the public website snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkouts keep no credentials: only the push and pull below get the token, as a per-command header the rest of this step never sees.
          auth=(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')")
          unset GH_TOKEN
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh website from the verified source catalog'
            # main can move after checkout; replay the snapshot onto it before retrying.
            for attempt in 1 2 3; do
              if env "${auth[@]}" git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then echo '::error::The website snapshot was not pushed to main after 3 attempts'; exit 1; fi
              env "${auth[@]}" git pull --rebase origin main || { echo '::error::The website snapshot could not be rebased onto a newer main; re-run publication'; git rebase --abort; exit 1; }
            done
          fi
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pipeline/source/dist/site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static catalog
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  notify_search:
    name: Notify search engines of published changes
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the published snapshot and accepted submission state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check out the exact source used in this publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reacher-z/Awesome-CUA
          ref: ${{ needs.build.outputs.source_commit }}
          path: .pipeline/source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Notify IndexNow after live-site and ownership checks
        run: |
          python3 .pipeline/source/scripts/submit_indexnow.py --submit \
            --site-dir "$GITHUB_WORKSPACE" \
            --state .indexnow/state.json \
            --receipts .indexnow/submissions.json
      - name: Preserve accepted state and actual submission receipts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkouts keep no credentials: only the push and pull below get the token, as a per-command header the rest of this step never sees.
          auth=(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')")
          unset GH_TOKEN
          if [ -d .indexnow ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .indexnow
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m 'Record search notification outcome for the published catalog'
              for attempt in 1 2 3; do
                if env "${auth[@]}" git push origin HEAD:main; then break; fi
                if [ "$attempt" = 3 ]; then echo '::error::The search notification receipts were not pushed to main after 3 attempts'; exit 1; fi
                env "${auth[@]}" git pull --rebase origin main || { echo '::error::The search notification receipts could not be rebased onto a newer main; re-run publication'; git rebase --abort; exit 1; }
              done
            fi
          fi
