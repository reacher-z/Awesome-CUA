name: Catalog quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate source-backed records
        run: python scripts/catalog.py validate
      - name: Check generated views before rebuilding
        run: python scripts/catalog.py build --check
      - name: Test ingestion and review safeguards
        run: python -m unittest discover -s tests -v
      - name: Build portable exports
        run: python scripts/catalog.py build
      - name: Test website search and state handling
        run: node --test tests/web.test.mjs
      - name: Build static website
        run: python scripts/build_site.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cua-catalog
          path: |
            dist/catalog.sqlite
            dist/catalog.json
            data/catalog.jsonl
            data/coverage.json
            dist/site/
